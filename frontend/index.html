      // ─── Scanner Tab ──────────────────────────────────────────────────────────────
      function ScannerTab({ tweaks, densityPad, onEditCard }) {
        const [files, setFiles] = useState([]);
        const [config, setConfig] = useState({
          model: "qwen2.5vl:7b",
          mode: "auto",
          rows: 4,
          cols: 2,
          timeout: 300,
          deskew: false,
        });
        const [phase, setPhase] = useState("idle"); // idle | preview | processing | results
        const [stage, setStage] = useState("warmup");
        const [progress, setProgress] = useState(0);
        const [message, setMessage] = useState("Loading model…");
        const [elapsed, setElapsed] = useState(0);
        const [cardCount, setCardCount] = useState(0);
        const timerRef = useRef(null);
        const abortRef = useRef(null);
        const [cards, setCards] = useState([]);
        const [runId, setRunId] = useState(null);
        const [errorMsg, setErrorMsg] = useState("");
        const [warnings, setWarnings] = useState([]);
        const [previewData, setPreviewData] = useState(null); // {previews:[{filename,cardCount,imageDataUrl}], totalCards}
        const [previewLoading, setPreviewLoading] = useState(false);
        // Manual grid line positions (normalized 0..1). h/v are internal
        // dividers; top/bottom/left/right are the outer crop box edges.
        const [gridLines, setGridLines] = useState({
          h: [],
          v: [],
          top: 0,
          bottom: 1,
          left: 0,
          right: 1,
        });

        // Whenever the grid spec (mode/rows/cols) changes, regenerate equally
        // spaced default lines and reset the outer crop. The user can then
        // drag everything. Switching off grid mode clears the lines so
        // default detection takes over.
        useEffect(() => {
          if (config.mode !== "grid") {
            setGridLines({
              h: [],
              v: [],
              top: 0,
              bottom: 1,
              left: 0,
              right: 1,
            });
            return;
          }
          setGridLines((prev) => {
            const top = prev.top ?? 0,
              bottom = prev.bottom ?? 1;
            const left = prev.left ?? 0,
              right = prev.right ?? 1;
            return {
              h: Array.from(
                { length: Math.max(0, config.rows - 1) },
                (_, i) => top + ((i + 1) / config.rows) * (bottom - top),
              ),
              v: Array.from(
                { length: Math.max(0, config.cols - 1) },
                (_, i) => left + ((i + 1) / config.cols) * (right - left),
              ),
              top,
              bottom,
              left,
              right,
            };
          });
        }, [config.mode, config.rows, config.cols]);

        // Store actual File objects so we can send them to the server
        const handleFilesAdded = (newFiles) => {
          setErrorMsg("");
          setFiles((prev) => [...prev, ...newFiles]);
        };

        // Step 1: run detection only and show annotated preview
        const handlePreview = async () => {
          if (!files.length) return;
          setErrorMsg("");
          setWarnings([]);
          setPreviewLoading(true);
          const formData = new FormData();
          files.forEach((f) => formData.append("files", f));
          formData.append("mode", config.mode);
          formData.append("rows", String(config.rows));
          formData.append("cols", String(config.cols));
          if (config.mode === "grid") {
            if (gridLines.h.length)
              formData.append("row_lines", gridLines.h.join(","));
            if (gridLines.v.length)
              formData.append("col_lines", gridLines.v.join(","));
            formData.append("margin_top", String(gridLines.top ?? 0));
            formData.append("margin_bottom", String(gridLines.bottom ?? 1));
            formData.append("margin_left", String(gridLines.left ?? 0));
            formData.append("margin_right", String(gridLines.right ?? 1));
          }
          if (config.deskew) formData.append("deskew", "true");
          try {
            const r = await fetch("/api/preview", {
              method: "POST",
              body: formData,
            });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const data = await r.json();
            setPreviewData(data);
            setPhase("preview");
          } catch (err) {
            console.error("[preview] failed:", err);
            setErrorMsg(String(err.message || err));
          } finally {
            setPreviewLoading(false);
          }
        };

        const handleBackToIdle = () => {
          setPreviewData(null);
          setPhase("idle");
        };

        // Debounced re-preview when detection settings change during preview phase
        useEffect(() => {
          if (phase !== "preview" || !files.length) return;
          const t = setTimeout(() => {
            handlePreview();
          }, 350);
          return () => clearTimeout(t);
          // Only depend on the config knobs that affect detection
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [config.mode, config.rows, config.cols, config.deskew, gridLines]);

        const handleStop = async () => {
          // Tell the server to stop at the next safe checkpoint
          try {
            await fetch("/api/scan/stop", { method: "POST" });
          } catch {}
          // Cancel the SSE stream client-side
          if (abortRef.current) {
            try {
              abortRef.current.abort();
            } catch {}
          }
          setMessage("Stopping…");
        };

        const handleProcess = async () => {
          if (!files.length) return;
          console.log("[scan] starting", { fileCount: files.length, config });
          setErrorMsg("");
          setWarnings([]);
          setPhase("processing");
          setProgress(0);
          setStage("warmup");
          setMessage("Loading model…");
          setElapsed(0);
          setCardCount(0);
          timerRef.current = setInterval(() => setElapsed((e) => e + 1), 1000);

          const formData = new FormData();
          files.forEach((f) => formData.append("files", f));
          formData.append("model", config.model);
          formData.append("mode", config.mode);
          formData.append("rows", String(config.rows));
          formData.append("cols", String(config.cols));
          formData.append("timeout", String(config.timeout));
          if (config.mode === "grid") {
            if (gridLines.h.length)
              formData.append("row_lines", gridLines.h.join(","));
            if (gridLines.v.length)
              formData.append("col_lines", gridLines.v.join(","));
            formData.append("margin_top", String(gridLines.top ?? 0));
            formData.append("margin_bottom", String(gridLines.bottom ?? 1));
            formData.append("margin_left", String(gridLines.left ?? 0));
            formData.append("margin_right", String(gridLines.right ?? 1));
          }
          if (config.deskew) formData.append("deskew", "true");

          abortRef.current = new AbortController();
          try {
            const response = await fetch("/api/scan", {
              method: "POST",
              body: formData,
              signal: abortRef.current.signal,
            });
            console.log("[scan] response", response.status);
            if (!response.ok) {
              let detail = `HTTP ${response.status}`;
              try {
                detail = (await response.text()) || detail;
              } catch {}
              throw new Error(detail);
            }
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            const localWarnings = [];

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split("\n");
              buffer = lines.pop(); // keep incomplete line
              for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                try {
                  const evt = JSON.parse(line.slice(6));
                  console.log("[scan] evt", evt.stage, evt.message || "");
                  if (evt.stage === "error") {
                    clearInterval(timerRef.current);
                    setErrorMsg(evt.message || "Scan failed");
                    setPhase("idle");
                    return;
                  }
                  if (evt.stage === "warning") {
                    localWarnings.push(evt.message || "");
                    setWarnings([...localWarnings]);
                    continue;
                  }
                  if (evt.stage === "stopped") {
                    clearInterval(timerRef.current);
                    setMessage(evt.message || "Scan cancelled");
                    setPhase("idle");
                    return;
                  }
                  if (evt.stage === "done") {
                    clearInterval(timerRef.current);
                    setCards(evt.cards || []);
                    setRunId(evt.runId || null);
                    setPhase("results");
                    return;
                  }
                  setStage(evt.stage);
                  setProgress(evt.progress || 0);
                  if (evt.message) setMessage(evt.message);
                  if (evt.cards) setCardCount(evt.cards.length);
                } catch (parseErr) {
                  console.warn("[scan] parse fail:", parseErr, line);
                }
              }
            }
            // Stream ended without 'done' — treat as error
            clearInterval(timerRef.current);
            setErrorMsg("Scan ended unexpectedly (no result event received)");
            setPhase("idle");
          } catch (err) {
            if (err.name === "AbortError") {
              clearInterval(timerRef.current);
              setPhase("idle");
              return;
            }
            console.error("[scan] failed:", err);
            clearInterval(timerRef.current);
            setErrorMsg(String(err.message || err));
            setPhase("idle");
          } finally {
            abortRef.current = null;
          }
        };

        // Cleanup timer on unmount
        useEffect(() => () => clearInterval(timerRef.current), []);

        const handleReset = () => {
          setPhase("idle");
          setFiles([]);
          setCards([]);
          setProgress(0);
          setPreviewData(null);
          setErrorMsg("");
          setWarnings([]);
        };

        // Merge contact fields pulled from a QR-linked page into a card.
        // Non-destructive: only fills fields the card doesn't already have,
        // so OCR data the user may have reviewed isn't silently overwritten.
        // Clears qrUrl (so the button hides) and flags qrResolved for the
        // provenance note.
        const handleMergeQr = (cardId, fields) => {
          setCards((prev) =>
            prev.map((c) => {
              if (c.id !== cardId) return c;
              const merged = { ...c.contact };
              const filled = [];
              for (const [k, v] of Object.entries(fields || {})) {
                if (v && !merged[k]) {
                  merged[k] = v;
                  filled.push(k);
                }
              }
              return {
                ...c,
                contact: merged,
                qrUrl: null,
                qrResolved: true,
                qrFilled: filled,
              };
            }),
          );
        };

        const handleToggleLock = async (id) => {
          // Optimistic flip
          let targetRepoId = null;
          let newLocked = false;
          setCards((prev) =>
            prev.map((c) => {
              if (c.id === id) {
                targetRepoId = c.repoId;
                newLocked = !c.locked;
                return { ...c, locked: newLocked };
              }
              return c;
            }),
          );
          // Persist to repo if this card was saved (has a repoId)
          if (targetRepoId) {
            try {
              const r = await fetch("/api/contacts/" + targetRepoId + "/lock", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ locked: newLocked }),
              });
              if (!r.ok) throw new Error("HTTP " + r.status);
            } catch (err) {
              console.error("[lock toggle] failed:", err);
              // Roll back
              setCards((prev) =>
                prev.map((c) =>
                  c.id === id ? { ...c, locked: !newLocked } : c,
                ),
              );
              alert("Could not change lock state: " + err.message);
            }
          }
        };

        return (
          <div style={{ flex: 1, overflow: "hidden", display: "flex", gap: 0 }}>
            {/* Left: Input panel */}
            <div
              style={{
                width: 320,
                flexShrink: 0,
                borderRight: "1px solid var(--border)",
                display: "flex",
                flexDirection: "column",
                gap: 0,
                overflowY: "auto",
                background: "var(--surface)",
              }}
            >
              <div
                style={{
                  padding: densityPad,
                  display: "flex",
                  flexDirection: "column",
                  gap: 16,
                }}
              >
                {/* Upload zone */}
                <UploadZone onFilesAdded={handleFilesAdded} />

                {/* File queue */}
                {files.length > 0 && (
                  <div
                    style={{ display: "flex", flexDirection: "column", gap: 8 }}
                  >
                    <div
                      style={{
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "space-between",
                      }}
                    >
                      <span
                        style={{
                          fontSize: 12,
                          fontWeight: 500,
                          color: "var(--text-secondary)",
                        }}
                      >
                        {files.length} file{files.length !== 1 ? "s" : ""}{" "}
                        queued
                      </span>
                      <button
                        onClick={() => setFiles([])}
                        style={{
                          fontSize: 11,
                          color: "var(--text-tertiary)",
                          background: "none",
                          border: "none",
                          cursor: "pointer",
                          padding: "2px 4px",
                        }}
                      >
                        Clear all
                      </button>
                    </div>
                    <FileQueue
                      files={files}
                      onRemove={(i) =>
                        setFiles((prev) => prev.filter((_, idx) => idx !== i))
                      }
                    />
                  </div>
                )}

                {/* Config */}
                <ConfigPanel config={config} onChange={setConfig} />
              </div>

              {/* Sticky process button */}
              <div
                style={{
                  marginTop: "auto",
                  padding: 16,
                  borderTop: "1px solid var(--border)",
                  position: "sticky",
                  bottom: 0,
                  background: "var(--surface)",
                }}
              >
                {phase === "results" ? (
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn
                      variant="ghost"
                      style={{ flex: 1 }}
                      onClick={handleReset}
                      icon={Icons.refresh}
                    >
                      New Scan
                    </Btn>
                    <Btn
                      variant="primary"
                      style={{ flex: 1 }}
                      icon={Icons.plus}
                      onClick={() => setPhase("idle")}
                    >
                      Add More
                    </Btn>
                  </div>
                ) : phase === "processing" ? (
                  <Btn
                    variant="ghost"
                    size="lg"
                    style={{
                      width: "100%",
                      justifyContent: "center",
                      color: "var(--danger, #d63b3b)",
                      borderColor: "var(--danger, #d63b3b)",
                    }}
                    onClick={handleStop}
                  >
                    <Spinner size={14} /> Stop scan
                  </Btn>
                ) : phase === "preview" ? (
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn
                      variant="ghost"
                      style={{ flex: 1 }}
                      onClick={handleBackToIdle}
                    >
                      Back
                    </Btn>
                    <Btn
                      variant="primary"
                      size="lg"
                      style={{ flex: 2, justifyContent: "center" }}
                      icon={Icons.scan}
                      onClick={handleProcess}
                    >
                      {`Extract ${previewData?.totalCards || 0} contact${(previewData?.totalCards || 0) !== 1 ? "s" : ""}`}
                    </Btn>
                  </div>
                ) : (
                  <Btn
                    variant="primary"
                    size="lg"
                    style={{ width: "100%", justifyContent: "center" }}
                    icon={previewLoading ? undefined : Icons.scan}
                    disabled={!files.length || previewLoading}
                    onClick={handlePreview}
                  >
                    {previewLoading ? (
                      <>
                        <Spinner size={14} /> Detecting…
                      </>
                    ) : (
                      `Preview ${files.length ? `${files.length} file${files.length !== 1 ? "s" : ""}` : "Cards"}`
                    )}
                  </Btn>
                )}
              </div>
            </div>

            {/* Right: Results / Processing area */}
            <div
              style={{
                flex: 1,
                overflowY: "auto",
                padding: densityPad,
                display: "flex",
                flexDirection: "column",
                gap: 16,
              }}
            >
              {phase === "idle" && errorMsg && (
                <div
                  className="fade-in"
                  style={{
                    background: "var(--danger-soft)",
                    color: "var(--danger)",
                    border: "1px solid oklch(85% 0.05 25)",
                    borderRadius: 8,
                    padding: "12px 16px",
                    fontSize: 13,
                    fontWeight: 500,
                    display: "flex",
                    alignItems: "flex-start",
                    gap: 10,
                  }}
                >
                  <Icons.close
                    color="currentColor"
                    width={14}
                    height={14}
                    style={{ marginTop: 2, flexShrink: 0 }}
                  />
                  <div style={{ flex: 1 }}>
                    <div style={{ marginBottom: 2 }}>Scan failed</div>
                    <div
                      style={{
                        fontSize: 12,
                        fontWeight: 400,
                        opacity: 0.85,
                        wordBreak: "break-word",
                      }}
                    >
                      {errorMsg}
                    </div>
                  </div>
                </div>
              )}
              {phase === "idle" && warnings.length > 0 && (
                <div
                  className="fade-in"
                  style={{
                    background: "var(--warning-soft)",
                    color: "var(--warning)",
                    border: "1px solid oklch(88% 0.06 60)",
                    borderRadius: 8,
                    padding: "10px 14px",
                    fontSize: 12,
                  }}
                >
                  {warnings.map((w, i) => (
                    <div key={i}>{w}</div>
                  ))}
                </div>
              )}
              {phase === "idle" && (
                <div
                  className="fade-in"
                  style={{
                    flex: 1,
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    justifyContent: "center",
                    gap: 16,
                    color: "var(--text-tertiary)",
                    textAlign: "center",
                    paddingTop: 40,
                  }}
                >
                  <div
                    style={{
                      width: 72,
                      height: 72,
                      borderRadius: 18,
                      background: "var(--surface)",
                      border: "1px solid var(--border)",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      boxShadow: "var(--shadow-sm)",
                    }}
                  >
                    <Icons.card
                      color="var(--border-strong)"
                      width={32}
                      height={32}
                    />
                  </div>
                  <div>
                    <div
                      style={{
                        fontSize: 15,
                        fontWeight: 500,
                        color: "var(--text-secondary)",
                        marginBottom: 6,
                      }}
                    >
                      No cards processed yet
                    </div>
                    <div
                      style={{
                        fontSize: 13,
                        color: "var(--text-tertiary)",
                        maxWidth: 320,
                        lineHeight: 1.6,
                      }}
                    >
                      Upload images on the left and click Process to extract
                      contact data automatically.
                    </div>
                  </div>

                  {/* Tips */}
                  <div
                    style={{
                      marginTop: 8,
                      background: "var(--surface)",
                      border: "1px solid var(--border)",
                      borderRadius: 10,
                      padding: "14px 18px",
                      width: "100%",
                      maxWidth: 380,
                    }}
                  >
                    <div
                      style={{
                        fontSize: 12,
                        fontWeight: 600,
                        color: "var(--text-secondary)",
                        marginBottom: 10,
                      }}
                    >
                      Quick tips
                    </div>
                    {[
                      [
                        "GLM-OCR is fastest",
                        "Only 0.9B params, loads in seconds",
                      ],
                      [
                        "QR codes auto-skip vision",
                        "Saves 20–30s when QR has email",
                      ],
                      [
                        "Batch scans supported",
                        "Upload a grid of cards as one image",
                      ],
                    ].map(([title, desc]) => (
                      <div
                        key={title}
                        style={{
                          display: "flex",
                          gap: 10,
                          marginBottom: 8,
                          alignItems: "flex-start",
                        }}
                      >
                        <Icons.bolt
                          color="var(--accent)"
                          width={12}
                          height={12}
                          style={{ marginTop: 2, flexShrink: 0 }}
                        />
                        <div>
                          <span
                            style={{
                              fontSize: 12,
                              fontWeight: 500,
                              color: "var(--text-primary)",
                            }}
                          >
                            {title} —{" "}
                          </span>
                          <span
                            style={{
                              fontSize: 12,
                              color: "var(--text-tertiary)",
                            }}
                          >
                            {desc}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {phase === "preview" && previewData && (
                <div
                  className="fade-in"
                  style={{ display: "flex", flexDirection: "column", gap: 14 }}
                >
                  <div
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 10,
                      flexWrap: "wrap",
                    }}
                  >
                    <div
                      style={{
                        fontSize: 14,
                        fontWeight: 600,
                        color: "var(--text-primary)",
                      }}
                    >
                      Detected {previewData.totalCards} card
                      {previewData.totalCards !== 1 ? "s" : ""}
                    </div>
                    {previewLoading ? (
                      <Badge label="Updating…" color="amber" dot />
                    ) : (
                      <Badge
                        label="Review before extracting"
                        color="blue"
                        dot
                      />
                    )}
                    <div style={{ flex: 1 }} />
                    <span
                      style={{ fontSize: 11, color: "var(--text-tertiary)" }}
                    >
                      Green boxes = cards that will be sent to the vision model
                    </span>
                  </div>

                  {/* Suggestion: when auto detector fell back to a uniform grid,
                            it returns the inferred dims — offer 1-click switch to
                            Grid mode with those rows/cols. */}
                  {config.mode === "auto" &&
                    previewData.previews[0]?.inferredGrid && (
                      <div
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 10,
                          padding: "8px 12px",
                          background: "var(--accent-soft)",
                          border: "1px solid oklch(85% 0.08 264)",
                          borderRadius: 6,
                          fontSize: 12,
                        }}
                      >
                        <Icons.bolt
                          color="var(--accent)"
                          width={12}
                          height={12}
                          style={{ flexShrink: 0 }}
                        />
                        <span
                          style={{ color: "var(--text-secondary)", flex: 1 }}
                        >
                          Auto detector inferred a{" "}
                          <strong>
                            {previewData.previews[0].inferredGrid.rows}×
                            {previewData.previews[0].inferredGrid.cols}
                          </strong>{" "}
                          grid for this image.
                        </span>
                        <button
                          onClick={() =>
                            setConfig({
                              ...config,
                              mode: "grid",
                              rows: previewData.previews[0].inferredGrid.rows,
                              cols: previewData.previews[0].inferredGrid.cols,
                            })
                          }
                          style={{
                            padding: "5px 12px",
                            border: "none",
                            borderRadius: 5,
                            background: "var(--accent)",
                            color: "white",
                            fontSize: 12,
                            fontFamily: "inherit",
                            fontWeight: 500,
                            cursor: "pointer",
                          }}
                        >
                          Apply {previewData.previews[0].inferredGrid.rows}×
                          {previewData.previews[0].inferredGrid.cols} grid
                        </button>
                      </div>
                    )}

                  {/* Inline detection controls — adjust without leaving preview */}
                  <div
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 12,
                      flexWrap: "wrap",
                      padding: "10px 14px",
                      background: "var(--surface)",
                      border: "1px solid var(--border)",
                      borderRadius: 8,
                    }}
                  >
                    <div
                      style={{
                        fontSize: 11,
                        fontWeight: 600,
                        color: "var(--text-tertiary)",
                        textTransform: "uppercase",
                        letterSpacing: "0.06em",
                      }}
                    >
                      Detection
                    </div>
                    {/* Mode segmented */}
                    <div
                      style={{
                        display: "flex",
                        border: "1px solid var(--border)",
                        borderRadius: 6,
                        overflow: "hidden",
                      }}
                    >
                      {[
                        { id: "auto", label: "Auto" },
                        { id: "single", label: "Single" },
                        { id: "grid", label: "Grid" },
                      ].map(({ id, label }) => (
                        <button
                          key={id}
                          onClick={() => setConfig({ ...config, mode: id })}
                          style={{
                            padding: "5px 12px",
                            border: "none",
                            cursor: "pointer",
                            background:
                              config.mode === id
                                ? "var(--accent-soft)"
                                : "var(--bg)",
                            color:
                              config.mode === id
                                ? "var(--accent)"
                                : "var(--text-secondary)",
                            fontSize: 12,
                            fontFamily: "inherit",
                            fontWeight: 500,
                            borderRight:
                              id !== "grid"
                                ? "1px solid var(--border)"
                                : "none",
                            transition: "all 0.15s",
                          }}
                        >
                          {label}
                        </button>
                      ))}
                    </div>

                    {/* Rows / Cols steppers — visible when grid OR auto fell back to grid */}
                    {config.mode === "grid" && (
                      <>
                        {[
                          ["rows", "Rows", config.rows],
                          ["cols", "Cols", config.cols],
                        ].map(([key, lbl, val]) => (
                          <div
                            key={key}
                            style={{
                              display: "flex",
                              alignItems: "center",
                              gap: 6,
                            }}
                          >
                            <span
                              style={{
                                fontSize: 11,
                                fontWeight: 500,
                                color: "var(--text-secondary)",
                              }}
                            >
                              {lbl}
                            </span>
                            <button
                              onClick={() =>
                                setConfig({
                                  ...config,
                                  [key]: Math.max(1, val - 1),
                                })
                              }
                              style={{
                                width: 24,
                                height: 24,
                                borderRadius: 5,
                                border: "1px solid var(--border)",
                                background: "var(--bg)",
                                cursor: "pointer",
                                fontSize: 14,
                                color: "var(--text-secondary)",
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "center",
                                padding: 0,
                              }}
                            >
                              −
                            </button>
                            <span
                              style={{
                                fontSize: 13,
                                fontWeight: 600,
                                color: "var(--text-primary)",
                                minWidth: 18,
                                textAlign: "center",
                              }}
                            >
                              {val}
                            </span>
                            <button
                              onClick={() =>
                                setConfig({
                                  ...config,
                                  [key]: Math.min(8, val + 1),
                                })
                              }
                              style={{
                                width: 24,
                                height: 24,
                                borderRadius: 5,
                                border: "1px solid var(--border)",
                                background: "var(--bg)",
                                cursor: "pointer",
                                fontSize: 14,
                                color: "var(--text-secondary)",
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "center",
                                padding: 0,
                              }}
                            >
                              +
                            </button>
                          </div>
                        ))}
                        <span
                          style={{
                            fontSize: 11,
                            color: "var(--text-tertiary)",
                          }}
                        >
                          = {config.rows * config.cols} tiles
                        </span>
                      </>
                    )}

                    <div style={{ flex: 1 }} />
                    {/* Auto-deskew toggle — helpful for photographed images */}
                    <label
                      title="Find the card cluster and warp it to axis-aligned rectangle before detection. Useful for photographed images with perspective distortion."
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 6,
                        padding: "4px 10px",
                        borderRadius: 6,
                        border: "1px solid",
                        borderColor: config.deskew
                          ? "var(--accent)"
                          : "var(--border)",
                        background: config.deskew
                          ? "var(--accent-soft)"
                          : "var(--bg)",
                        color: config.deskew
                          ? "var(--accent)"
                          : "var(--text-secondary)",
                        fontSize: 12,
                        fontFamily: "inherit",

      // Shared thumbnail avatar — shows the cropped card image when one
      // exists in `/api/thumbnails/<cardId>`, falls back to coloured
      // initials if the fetch 404s or no cardId is set. Click to open
      // a full-size lightbox.
      function ContactThumb({ cardId, hasThumb, initials, hue, size = 44 }) {
        const [failed, setFailed] = useState(false);
        const [zoom, setZoom] = useState(false);
        const showImg = cardId && hasThumb && !failed;

        const handleOpen = (e) => {
          if (!showImg) return;
          e.stopPropagation();
          setZoom(true);
        };

        // Esc-to-close + body scroll lock while the lightbox is open.
        useEffect(() => {
          if (!zoom) return;
          const onKey = (e) => {
            if (e.key === "Escape") setZoom(false);
          };
          window.addEventListener("keydown", onKey);
          const prevOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            window.removeEventListener("keydown", onKey);
            document.body.style.overflow = prevOverflow;
          };
        }, [zoom]);

        return (
          <>
            <div
              onClick={handleOpen}
              title={showImg ? "Click to enlarge" : undefined}
              style={{
                width: size,
                height: size,
                borderRadius: 8,
                flexShrink: 0,
                overflow: "hidden",
                background: showImg ? "var(--bg)" : `oklch(65% 0.15 ${hue})`,
                border: showImg ? "1px solid var(--border)" : "none",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: Math.round(size * 0.36),
                fontWeight: 700,
                color: "white",
                cursor: showImg ? "zoom-in" : "default",
              }}
            >
              {showImg ? (
                <img
                  src={`/api/thumbnails/${cardId}`}
                  alt=""
                  onError={() => setFailed(true)}
                  style={{
                    width: "100%",
                    height: "100%",
                    objectFit: "cover",
                    display: "block",
                  }}
                />
              ) : (
                initials
              )}
            </div>
            {zoom && (
              <div
                onClick={() => setZoom(false)}
                style={{
                  position: "fixed",
                  inset: 0,
                  background: "rgba(0,0,0,0.82)",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  zIndex: 20000,
                  cursor: "zoom-out",
                  backdropFilter: "blur(4px)",
                  padding: 24,
                }}
              >
                <img
                  src={`/api/thumbnails/${cardId}`}
                  alt=""
                  onClick={(e) => e.stopPropagation()}
                  style={{
                    maxWidth: "95vw",
                    maxHeight: "95vh",
                    objectFit: "contain",
                    boxShadow: "0 20px 60px rgba(0,0,0,0.5)",
                    borderRadius: 8,
                    cursor: "default",
                  }}
                />
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    setZoom(false);
                  }}
                  aria-label="Close"
                  style={{
                    position: "absolute",
                    top: 16,
                    right: 16,
                    width: 36,
                    height: 36,
                    borderRadius: "50%",
                    border: "none",
                    background: "rgba(255,255,255,0.15)",
                    color: "white",
                    fontSize: 22,
                    lineHeight: 1,
                    cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  ×
                </button>
              </div>
            )}
          </>
        );
      }

      function CompanyGroup({

        contacts,
        selectedIds,
        onSelect,
        onDelete,
        onEdit,

        expandedId,
        onToggleExpand,
        isOpen,

      }) {

        const [localOpen, setLocalOpen] = useState(true);

          onToggleOpen

        const allSelected = contacts.every((c) => selectedIds.has(c.id));

        const toggleAll = () => {

        return (
          <div style={{ marginBottom: 10 }}>

              style={{

                style={{

                  cursor: "pointer",
                  border: `1.5px solid ${allSelected ? `oklch(55% 0.22 ${hue})` : "var(--border-strong)"}`,

              <div

                  fontWeight: 600,

      // ─── Model Benchmark Modal ────────────────────────────────────────────────────
      // Re-scans the card images behind your locked (human-verified) contacts
      // with each selected model and scores field-level accuracy against the
      // verified data. Answers "which model should I default to?" with your
      // own cards instead of vibes.
      function BenchmarkModal({ lockedCount, onClose }) {
        const [available, setAvailable] = useState([]); // installed ollama models
        const [selected, setSelected] = useState(new Set());
        const [limit, setLimit] = useState(10);
        const [running, setRunning] = useState(false);
        const [progress, setProgress] = useState(null); // {pct, message}
        const [results, setResults] = useState(null);
        const [itemCount, setItemCount] = useState(0);
        const [error, setError] = useState(null);

        // Installed models, with the curated catalogue ones preselected.
        useEffect(() => {
          window
            .apiGet("/api/status")
            .then((s) => {
              const models = s.models || [];
              setAvailable(models);
              const pre = new Set();
              models.forEach((m) => {
                if (
                  VISION_MODELS.some(
                    (v) =>
                      m === v.id || m.startsWith(v.id) || v.id.startsWith(m),
                  )
                )
                  pre.add(m);
              });
              setSelected(pre);
            })
            .catch(() => setAvailable([]));
        }, []);

        const toggle = (m) =>
          setSelected((prev) => {
            const next = new Set(prev);
            if (next.has(m)) next.delete(m);
            else next.add(m);
            return next;
          });

        const handleRun = async () => {
          if (selected.size === 0 || running) return;
          setRunning(true);
          setError(null);
          setResults(null);
          setProgress({ pct: 0, message: "Starting…" });
          try {
            const r = await fetch("/api/benchmark", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                models: Array.from(selected),
                limit: Number(limit) || 10,
              }),
            });
            if (!r.ok) {
              const detail = await r.text().catch(() => "");
              throw new Error("HTTP " + r.status + ": " + detail.slice(0, 200));
            }
            const reader = r.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let done = false;
            while (!done) {
              const chunk = await reader.read();
              if (chunk.done) break;
              buffer += decoder.decode(chunk.value, { stream: true });
              const lines = buffer.split("\n");
              buffer = lines.pop();
              for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                const evt = JSON.parse(line.slice(6));
                if (evt.stage === "done") {
                  setResults(evt.results || []);
                  setItemCount(evt.items || 0);
                  setProgress(null);
                  done = true;
                  break;
                }
                if (evt.stage === "stopped") {
                  setProgress(null);
                  done = true;
                  break;
                }
                if (evt.stage === "bench") {
                  setProgress({
                    pct: evt.progress || 0,
                    message: evt.message || "",
                  });
                }
              }
            }
          } catch (err) {
            setError(err.message);
            setProgress(null);
          } finally {
            setRunning(false);
          }
        };

        const handleStop = () => {
          fetch("/api/benchmark/stop", { method: "POST" }).catch(() => {});
        };

        const FIELD_COLS = [
          ["fullName", "Name"],
          ["title", "Title"],
          ["company", "Company"],
          ["email", "Email"],
          ["phone", "Phone"],
          ["mobile", "Mobile"],
          ["website", "Web"],
        ];

        const pctColor = (p) =>
          p >= 80
            ? "var(--success)"
            : p >= 50
              ? "var(--warning)"
              : "var(--danger)";

        return (
          <div
            onClick={running ? undefined : onClose}
            style={{
              position: "fixed",
              inset: 0,
              backgroundColor: "rgba(0,0,0,0.5)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              zIndex: 10000,
              backdropFilter: "blur(4px)",
            }}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              style={{
                backgroundColor: "var(--surface)",
                borderRadius: "var(--radius-lg)",
                width: "92%",
                maxWidth: 720,
                maxHeight: "90vh",
                overflow: "auto",
                boxShadow: "var(--shadow-lg)",
                padding: "20px 24px",
              }}
            >
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  marginBottom: 6,
                }}
              >
                <div style={{ fontSize: 16, fontWeight: 700 }}>
                  Model benchmark
                </div>
                <div style={{ flex: 1 }} />
                <button
                  onClick={onClose}
                  disabled={running}
                  style={{
                    border: "none",
                    background: "none",
                    fontSize: 20,
                    cursor: running ? "not-allowed" : "pointer",
                    color: "var(--text-tertiary)",
                  }}
                >
                  ×
                </button>
              </div>
              <div
                style={{
                  fontSize: 12,
                  color: "var(--text-secondary)",
                  marginBottom: 14,
                  lineHeight: 1.5,
                }}
              >
                Re-scans the card images behind your{" "}
                <strong>{lockedCount} locked contacts</strong> with each
                selected model and scores every field against your verified
                data. QR codes are excluded — this measures pure vision
                extraction (with the app's normal post-processing).
              </div>

              {/* Model checkboxes */}
              <div
                style={{
                  display: "flex",
                  flexWrap: "wrap",
                  gap: 8,
                  marginBottom: 12,
                }}
              >
                {available.length === 0 && (
                  <span style={{ fontSize: 12, color: "var(--text-tertiary)" }}>
                    No models reported by Ollama.
                  </span>
                )}
                {available.map((m) => (
                  <label
                    key={m}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 6,
                      padding: "5px 10px",
                      borderRadius: 99,
                      border: `1px solid ${selected.has(m) ? "var(--accent)" : "var(--border)"}`,
                      background: selected.has(m)
                        ? "var(--accent-soft)"
                        : "var(--bg)",
                      fontSize: 12,
                      cursor: "pointer",
                    }}
                  >
                    <input
                      type="checkbox"
                      checked={selected.has(m)}
                      onChange={() => toggle(m)}
                      disabled={running}
                      style={{ margin: 0 }}
                    />
                    {m}
                  </label>
                ))}
              </div>

              {/* Limit + run */}
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  marginBottom: 14,
                }}
              >
                <label style={{ fontSize: 12, color: "var(--text-secondary)" }}>
                  Cards:
                </label>
                <input
                  type="number"
                  min={1}
                  max={Math.max(lockedCount, 1)}
                  value={limit}
                  disabled={running}
                  onChange={(e) => setLimit(e.target.value)}
                  style={{
                    width: 64,
                    padding: "5px 8px",
                    border: "1px solid var(--border)",
                    borderRadius: 6,
                    background: "var(--bg)",
                    color: "var(--text-primary)",
                    fontSize: 12,
                    fontFamily: "inherit",
                  }}
                />
                <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>
                  ≈ {Math.max(1, Number(limit) || 10) * selected.size}{" "}
                  extractions — expect ~5-30 s each
                </span>
                <div style={{ flex: 1 }} />
                {running ? (
                  <Btn size="sm" variant="danger" onClick={handleStop}>
                    Stop
                  </Btn>
                ) : (
                  <Btn
                    size="sm"
                    variant="primary"
                    icon={Icons.bolt}
                    disabled={selected.size === 0}
                    onClick={handleRun}
                  >
                    Run benchmark
                  </Btn>
                )}
              </div>

              {/* Progress */}
              {progress && (
                <div style={{ marginBottom: 14 }}>
                  <div
                    style={{
                      height: 6,
                      borderRadius: 3,
                      background: "var(--bg)",
                      overflow: "hidden",
                      marginBottom: 6,
                    }}
                  >
                    <div
                      style={{
                        width: `${progress.pct}%`,
                        height: "100%",
                        background: "var(--accent)",
                        transition: "width 0.3s",
                      }}
                    />
                  </div>
                  <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>
                    {progress.message}
                  </div>
                </div>
              )}

              {error && (
                <div
                  style={{
                    fontSize: 12,
                    color: "var(--danger)",
                    marginBottom: 12,
                  }}
                >
                  ✗ {error}
                </div>
              )}

              {/* Results table */}
              {results && (
                <div style={{ overflowX: "auto" }}>
                  <div
                    style={{
                      fontSize: 12,
                      fontWeight: 600,
                      marginBottom: 6,
                    }}
                  >
                    Results — {itemCount} card{itemCount !== 1 ? "s" : ""},
                    field accuracy vs your verified data
                  </div>
                  <table
                    style={{
                      borderCollapse: "collapse",
                      width: "100%",
                      fontSize: 12,
                    }}
                  >
                    <thead>
                      <tr>
                        {[
                          "Model",
                          ...FIELD_COLS.map(([, l]) => l),
                          "Overall",
                          "Avg",
                        ].map((h) => (
                          <th
                            key={h}
                            style={{
                              textAlign: "left",
                              padding: "6px 8px",
                              borderBottom: "2px solid var(--border)",
                              color: "var(--text-secondary)",
                              fontWeight: 600,
                              whiteSpace: "nowrap",
                            }}
                          >
                            {h}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {results.map((r, i) => (
                        <tr
                          key={r.model}
                          style={{
                            background:
                              i === 0 ? "var(--success-soft)" : "transparent",
                          }}
                        >
                          <td
                            style={{
                              padding: "6px 8px",
                              fontWeight: i === 0 ? 700 : 500,
                              whiteSpace: "nowrap",
                            }}
                          >
                            {i === 0 ? "🏆 " : ""}
                            {r.model}
                            {r.failures > 0 && (
                              <span
                                title={`${r.failures} extraction failure(s)`}
                                style={{
                                  color: "var(--danger)",
                                  marginLeft: 4,
                                  fontSize: 10,
                                }}
                              >
                                ({r.failures}✗)
                              </span>
                            )}
                          </td>
                          {FIELD_COLS.map(([f]) => {
                            const cell = r.fields[f];
                            return (
                              <td
                                key={f}
                                title={
                                  cell ? `${cell.ok}/${cell.total}` : "no data"
                                }
                                style={{
                                  padding: "6px 8px",
                                  color: cell
                                    ? pctColor(cell.pct)
                                    : "var(--text-tertiary)",
                                  fontVariantNumeric: "tabular-nums",
                                }}
                              >
                                {cell ? `${cell.pct}%` : "—"}
                              </td>
                            );
                          })}
                          <td
                            style={{
                              padding: "6px 8px",
                              fontWeight: 700,
                              color: pctColor(r.overall.pct),
                              fontVariantNumeric: "tabular-nums",
                            }}
                            title={`${r.overall.ok}/${r.overall.total} fields`}
                          >
                            {r.overall.pct}%
                          </td>
                          <td
                            style={{
                              padding: "6px 8px",
                              color: "var(--text-secondary)",
                              whiteSpace: "nowrap",
                            }}
                          >
                            {(r.avg_ms / 1000).toFixed(1)}s
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        );
      }

      function ContactsTab({ tweaks, densityPad }) {
        const [contacts, setContacts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [search, setSearch] = useState("");
        const [groupByCompany, setGroupByCompany] = useState(true);
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [expandedId, setExpandedId] = useState(null);
        const [exportDone, setExportDone] = useState("");
        const [editingContact, setEditingContact] = useState(null);
        const [showBenchmark, setShowBenchmark] = useState(false);
        // Which company groups are currently open. Default: all open.
        // Tracked here (not in each CompanyGroup) so a single button in
        // the toolbar can collapse / expand them all at once.
        const [openCompanies, setOpenCompanies] = useState(null); // null = "all open"
        const toggleCompanyOpen = (name, open) => {
          setOpenCompanies((prev) => {
            const set = prev ? new Set(prev) : new Set(); // null → start empty
            if (open) set.add(name);
            else set.delete(name);
            return set;
          });
        };

        // Load real contacts on mount
        useEffect(() => {
          window
            .apiGet("/api/contacts")
            .then((data) => {
              setContacts(Array.isArray(data) ? data : []);
              setLoading(false);
            })
            .catch(() => {
              setContacts(MOCK_CONTACTS);
              setLoading(false);
            });
        }, []);

        const filtered = useMemo(() => {
          const q = search.toLowerCase();
          if (!q) return contacts;
          return contacts.filter((c) =>
            [
              c.contact.fullName,
              c.contact.company,
              c.contact.email,
              c.contact.phone,
            ].some((v) => v && v.toLowerCase().includes(q)),
          );
        }, [contacts, search]);

        const grouped = useMemo(() => {
          const g = {};
          filtered.forEach((c) => {
            const key = c.contact.company || "(No company)";
            if (!g[key]) g[key] = [];
            g[key].push(c);
          });
          return Object.entries(g).sort(([a], [b]) =>
            a === "(No company)"
              ? 1
              : b === "(No company)"
                ? -1
                : a.localeCompare(b),
          );
        }, [filtered]);

        const toggleSelect = (id, force) => {
          setSelectedIds((prev) => {
            const next = new Set(prev);
            if (force === true) next.add(id);
            else if (force === false) next.delete(id);
            else if (next.has(id)) next.delete(id);
            else next.add(id);
            return next;
          });
        };

        const handleDelete = (id) => {
          setContacts((prev) => prev.filter((c) => c.id !== id));
          window.apiDel("/api/contacts/" + id).catch(() => {});
        };
        const handleToggleExpand = (id) =>
          setExpandedId((prev) => (prev === id ? null : id));

        // Toggle the persistent lock flag on a repo contact.
        // Optimistic UI: flip locally first, then PUT to backend.
        // If backend rejects, roll back the local state.
        const handleToggleLock = async (contactRow) => {
          const id = contactRow.id;
          const newLocked = !contactRow.locked;
          setContacts((prev) =>
            prev.map((c) => (c.id === id ? { ...c, locked: newLocked } : c)),
          );
          try {
            const r = await fetch("/api/contacts/" + id + "/lock", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ locked: newLocked }),
            });
            if (!r.ok) throw new Error("HTTP " + r.status);
          } catch (err) {
            console.error("[lock toggle] failed:", err);
            // Roll back
            setContacts((prev) =>
              prev.map((c) => (c.id === id ? { ...c, locked: !newLocked } : c)),
            );
            alert("Could not change lock state: " + err.message);
          }
        };

        const handleEdit = (c) => setEditingContact(c);

        const handleEditSave = async (updatedCard) => {
          const id = updatedCard.id;
          // Optimistic update
          setContacts((prev) =>
            prev.map((c) =>
              c.id === id ? { ...c, contact: updatedCard.contact } : c,
            ),
          );
          setEditingContact(null);
          try {
            await window.apiPut("/api/contacts/" + id, {
              contact: updatedCard.contact,
            });
          } catch (err) {
            console.error("Update contact failed:", err);
            // Reload from server to revert if anything went wrong
            window
              .apiGet("/api/contacts")
              .then((data) => {
                if (Array.isArray(data)) setContacts(data);
              })
              .catch(() => {});
          }
        };

        const handleExport = (fmt) => {
          const fmtMap = { VCF: "vcf", Excel: "xlsx", CSV: "csv" };
          window.apiDown("/api/contacts/export/" + (fmtMap[fmt] || "vcf"));
          setExportDone(fmt);
          setTimeout(() => setExportDone(""), 2000);
        };

        const stats = {
          total: contacts.length,
          withEmail: contacts.filter((c) => c.contact.email).length,
          withPhone: contacts.filter((c) => c.contact.phone).length,
          companies: new Set(
            contacts.map((c) => c.contact.company).filter(Boolean),
          ).size,
        };

        const allFilteredSelected =
          filtered.length > 0 && filtered.every((c) => selectedIds.has(c.id));
        const toggleAll = () => {
          if (allFilteredSelected) setSelectedIds(new Set());
          else setSelectedIds(new Set(filtered.map((c) => c.id)));
        };

        return (
          <div
            style={{
              flex: 1,
              overflow: "hidden",
              display: "flex",
              flexDirection: "column",
            }}
          >
            {/* Stats bar */}
            <div
              style={{
                padding: `${densityPad}px ${densityPad}px 0`,
                flexShrink: 0,
              }}
            >
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(4, 1fr)",
                  gap: 10,
                  marginBottom: 16,
                }}
              >
                <StatCard
                  value={stats.total}
                  label="Total contacts"
                  accent="var(--accent)"
                />
                <StatCard
                  value={stats.withEmail}
                  label="With email"
                  accent="var(--success)"
                />
                <StatCard value={stats.withPhone} label="With phone" />

        useEffect(() => {
          if (!modelMenuOpen) return;
          const close = (e) => {
            if (
              modelMenuRef.current &&
              !modelMenuRef.current.contains(e.target)
            ) {
              setModelMenuOpen(false);
            }

          window.addEventListener("mousedown", close);
          return () => window.removeEventListener("mousedown", close);
        }, [modelMenuOpen]);
        const dt = new Date(run.createdAt);
        const dateStr = dt.toLocaleDateString("en-GB", {
          day: "2-digit",

                            // Sort installed models by VISION_MODELS catalogue
                            // order (known/recommended first), unknowns last
                            // alphabetically. So qwen2.5vl and glm-ocr float
                            // to the top and obscure third-party models sink.
                            [...(availableModels || [])]
                              .sort((a, b) => {
                                const rank = (id) => {
                                  const i = VISION_MODELS.findIndex(
                                    (v) =>
                                      v.id === id ||
                                      id.startsWith(v.id) ||
                                      v.id.startsWith(id),
                                  );
                                  return i === -1 ? 999 : i;
                                };
                                const ra = rank(a);
                                const rb = rank(b);
                                if (ra !== rb) return ra - rb;
                                return a.localeCompare(b);

                                    v.id === m ||
                                    m.startsWith(v.id) ||
                                    v.id.startsWith(m),

                                      setModelMenuOpen(false);
                                      onRelaunch(run.id, { model: m });

      function HistoryTab({ tweaks, densityPad }) {
        const [runs, setRuns] = useState([]);
        const [loadingHistory, setLoadingHistory] = useState(true);
        const [expandedId, setExpandedId] = useState(null);
        const [relaunching, setRelaunching] = useState(null); // runId
        // Per-relaunch progress so the overlay shows real status, not a fake spinner
        const [relaunchProgress, setRelaunchProgress] = useState({
          stage: "warmup",
          progress: 0,
          message: "",
        });
        // Map of newly-created run id → its full card array (with repoStatus,
        // conflicts, additions). Populated when a relaunch finishes so we
        // can render the conflict / merge details inline on the new run's
        // History card, without making the user hunt for them in another
        // tab (the SSE response data isn't preserved by /api/history).
        const [relaunchResults, setRelaunchResults] = useState({});
        const [filterModel, setFilterModel] = useState("all");
        // Models available on this Ollama instance, used to populate the
        // "Relaunch with…" model-picker flyout. Fetched once on mount.
        const [availableModels, setAvailableModels] = useState([]);
        useEffect(() => {
          window
            .apiGet("/api/status")
            .then((s) => {
              const raw = Array.isArray(s.models) ? s.models : [];
              // Strip Ollama tag suffix (":latest", ":13b") for a cleaner list
              const cleaned = Array.from(
                new Set(
                  raw.map((m) => (m || "").split(":")[0]).filter(Boolean),
                ),
              );
              setAvailableModels(cleaned);
            })
            .catch(() => setAvailableModels([]));
        }, []);

        // Load real history on mount
        useEffect(() => {
          window
            .apiGet("/api/history")
            .then((data) => {
              setRuns(Array.isArray(data) ? data : []);
              setLoadingHistory(false);
            })
            .catch(() => {
              setRuns(MOCK_RUNS);
              setLoadingHistory(false);
            });
        }, []);

        const models = useMemo(() => {
          const s = new Set(runs.map((r) => r.settings.vision_model));
          return ["all", ...Array.from(s)];
        }, [runs]);

        const filtered = useMemo(
          () =>
            filterModel === "all"
              ? runs
              : runs.filter((r) => r.settings.vision_model === filterModel),
          [runs, filterModel],
        );

        // Re-run a past scan against its archived original files. Streams
        // progress via SSE just like a fresh scan. The new results land
        // as a separate history run; the original is left untouched.
        // `options` is optional. Currently supported keys:
        //   { model: "claude" | "openai" | "glm-ocr" | ... }
        // Pass {} (or nothing) to re-run with the original saved settings.
        const handleRelaunch = async (id, options = {}) => {
          if (relaunching) return; // ignore double-clicks while one is in-flight
          setRelaunching(id);
          setRelaunchProgress({
            stage: "warmup",
            progress: 0,
            message: options.model
              ? `Starting (model: ${options.model})…`
              : "Starting…",
          });
          try {
            const response = await fetch("/api/history/" + id + "/relaunch", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(options || {}),
            });
            if (!response.ok) {
              const detail = await response.text().catch(() => "");
              throw new Error(
                "HTTP " + response.status + ": " + detail.slice(0, 200),
              );
            }
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let done = false;
            let finalCards = null; // capture the 'done' event's card array
            let finalRunId = null; // capture the NEW run's id from the 'done' event
            const warnings = []; // collect 'warning' SSE events (skipped files etc.)
            while (!done) {
              const r = await reader.read();
              if (r.done) break;
              buffer += decoder.decode(r.value, { stream: true });
              const lines = buffer.split("\n");
              buffer = lines.pop();
              for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                try {
                  const evt = JSON.parse(line.slice(6));
                  if (evt.stage === "error") {
                    throw new Error(evt.message || "Scan error");
                  }
                  if (evt.stage === "done") {
                    finalCards = evt.cards || [];
                    // Capture the NEW run's id so we can auto-expand it
                    // in the history list and show conflict details inline.
                    if (evt.runId) finalRunId = evt.runId;
                    done = true;
                    break;
                  }
                  if (evt.stage === "stopped") {
                    done = true;
                    break;
                  }
                  if (evt.stage === "warning" && evt.message) {
                    warnings.push(evt.message);
                  }
                  setRelaunchProgress({
                    stage: evt.stage,
                    progress: evt.progress || 0,
                    message: evt.message || "",
                  });
                } catch (parseErr) {
                  if (
                    parseErr.message &&
                    parseErr.message !== "Unexpected end of JSON input"
                  ) {
                    throw parseErr;
                  }
                }
              }
            }

            // Refresh history list so the new run shows up
            const fresh = await window.apiGet("/api/history");
            setRuns(Array.isArray(fresh) ? fresh : []);

            // Cache the SSE 'done' card array keyed by the new run id so
            // RunCard can render conflicts/additions inline. /api/history
            // doesn't surface repoStatus per card, so this client-side
            // cache is the only place those details exist post-relaunch.
            if (finalRunId && finalCards) {
              setRelaunchResults((prev) => ({
                ...prev,
                [finalRunId]: finalCards,
              }));
              // Auto-expand the new run so the user immediately sees the
              // inline conflict / additions panels — no scrolling, no
              // tab switching, no hunting.
              setExpandedId(finalRunId);
            }

            // Summarise what happened to the contacts repo. Each card has
            // repoStatus = added | updated | merged | conflict. This is the
            // most useful feedback for the user — without it relaunch looks
            // like nothing happened because the email-keyed merge means
            // the contact count rarely changes.
            if (finalCards && finalCards.length > 0) {
              const tally = { added: 0, updated: 0, merged: 0, conflict: 0 };
              let totalAdditions = 0;
              let totalConflicts = 0;
              for (const c of finalCards) {
                const s = c.repoStatus || "added";
                if (tally[s] !== undefined) tally[s]++;
                totalAdditions += Object.keys(c.additions || {}).length;
                if ((c.conflicts || []).length > 0) {
                  totalConflicts += c.conflicts.length;
                }
              }
              const lines = [
                `Relaunch finished. ${finalCards.length} card${finalCards.length !== 1 ? "s" : ""} extracted.`,
                "",
                `  • ${tally.added} new contact${tally.added !== 1 ? "s" : ""} added`,
                `  • ${tally.updated} existing contact${tally.updated !== 1 ? "s" : ""} updated (unlocked overwrite)`,
                `  • ${tally.merged} locked contact${tally.merged !== 1 ? "s" : ""} had fields merged in (additive)`,
                `  • ${tally.conflict} locked contact${tally.conflict !== 1 ? "s" : ""} had field conflicts`,
              ];
              if (totalAdditions > 0) {
                lines.push(
                  "",
                  `  Fields added across all merges: ${totalAdditions}`,
                );
              }
              if (totalConflicts > 0) {
                lines.push(
                  "",
                  `  ${totalConflicts} unresolved field conflict${totalConflicts !== 1 ? "s" : ""}.`,
                  `  Details are shown below on the newly-created run card`,
                  `  (it's auto-expanded). To resolve, edit the locked`,
                  `  contact in the Contacts tab.`,
                );
              }
              if (warnings.length > 0) {
                lines.push("", "Warnings:", ...warnings.map((w) => `  • ${w}`));
              }
              alert(lines.join("\n"));
            } else if (warnings.length > 0) {
              // 0 cards but the server told us why — surface it instead of
              // letting the relaunch look like a silent no-op.
              alert(
                "Relaunch finished but produced 0 cards.\n\nWarnings:\n" +
                  warnings.map((w) => `  • ${w}`).join("\n"),
              );
            } else if (!finalCards || finalCards.length === 0) {
              alert(
                "Relaunch finished but produced 0 cards. The model may have failed to extract anything from the archived originals — try a different model from the dropdown.",
              );
            }
          } catch (err) {
            console.error("[relaunch] failed:", err);
            alert("Relaunch failed: " + err.message);
          } finally {
            setRelaunching(null);
          }
        };

        const handleDelete = (id) => {
          setRuns((prev) => prev.filter((r) => r.id !== id));
          if (expandedId === id) setExpandedId(null);
          window.apiDel("/api/history/" + id).catch(() => {});
        };

        const handleZip = (id) => window.apiDown("/api/history/" + id + "/zip");

        const totalCards = runs.reduce((a, r) => a + r.cards.length, 0);
        const totalEmails = runs.reduce(
          (a, r) => a + r.cards.filter((c) => c.contact.email).length,

        );

        // Group by date
        const byDate = useMemo(() => {
          const g = {};
          filtered.forEach((run) => {
            const date = new Date(run.createdAt).toLocaleDateString("en-GB", {
              day: "2-digit",
              month: "long",
              year: "numeric",
            });

            g[date].push(run);

          return Object.entries(g);

        return (

                  {models.map((m) => (
                    <button
