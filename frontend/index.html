                  }
                >
                  Cancel
                </button>
                <button
                  onClick={handleSave}
                  disabled={isSaving}
                  style={{
                    padding: "10px 20px",
                    borderRadius: "var(--radius)",
                    border: "none",
                    backgroundColor: "var(--accent)",
                    color: "white",
                    fontSize: 13,
                    fontWeight: 500,
                    fontFamily: "inherit",
                    cursor: isSaving ? "not-allowed" : "pointer",
                    opacity: isSaving ? 0.7 : 1,
                    transition: "all 0.15s",
                  }}
                  onMouseEnter={(e) =>
                    !isSaving &&
                    (e.target.style.backgroundColor = "var(--accent-hover)")
                  }
                  onMouseLeave={(e) =>
                    !isSaving &&
                    (e.target.style.backgroundColor = "var(--accent)")
                  }
                >
                  {isSaving ? "Saving..." : "Save Changes"}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════
      // ROOT APP
      // ═══════════════════════════════════════════════════════════
      function App() {
        const [tweaks, setTweakRaw] = useState(TWEAK_DEFAULTS);
        const [panelOpen, setPanelOpen] = useState(false);
        const [activeTab, setActiveTab] = useState("scanner");
        const [editingCard, setEditingCard] = useState(null);

        // Tweaks (local only, no iframe postMessage)
        const setTweak = useCallback((keyOrEdits, val) => {
          const edits =
            typeof keyOrEdits === "object" && keyOrEdits !== null
              ? keyOrEdits
              : { [keyOrEdits]: val };
          setTweakRaw((prev) => ({ ...prev, ...edits }));
        }, []);

        useEffect(() => {
          const onMsg = (e) => {
            const t = e?.data?.type;
            if (t === "__activate_edit_mode") setPanelOpen(true);
            else if (t === "__deactivate_edit_mode") setPanelOpen(false);
          };
          window.addEventListener("message", onMsg);
          return () => window.removeEventListener("message", onMsg);
        }, []);

        const densityPad =
          tweaks.density === "compact"
            ? 16
            : tweaks.density === "spacious"
              ? 32
              : 22;

        // Update accent CSS var dynamically
        useEffect(() => {
          const map = {
            indigo: "oklch(55% 0.22 264)",
            teal: "oklch(53% 0.18 185)",
            violet: "oklch(54% 0.22 290)",
            rose: "oklch(53% 0.2 25)",
          };
          const soft = {
            indigo: "oklch(95.5% 0.035 264)",
            teal: "oklch(96% 0.03 185)",
            violet: "oklch(95.5% 0.03 290)",
            rose: "oklch(96% 0.03 25)",
          };
          document.documentElement.style.setProperty(
            "--accent",
            map[tweaks.accentColor] || map.indigo,
          );
          document.documentElement.style.setProperty(
            "--accent-soft",
            soft[tweaks.accentColor] || soft.indigo,
          );
        }, [tweaks.accentColor]);

        const handleEditCard = (card) => {
          setEditingCard(card);
        };

        const handleSaveEdit = async (updatedCard) => {
          try {
            // First, try to find existing contact by ID if available
            let contactId = updatedCard.id;

            if (!contactId && updatedCard.cardId) {
              // If we have a cardId from scanning, try to find by email
              const email = updatedCard.contact.email;
              if (email) {
                try {
                  // Get all contacts to find by email
                  const contacts = await window.apiGet("/api/contacts");
                  const existing = contacts.find(
                    (c) => c.contact.email === email,
                  );
                  if (existing) {
                    contactId = existing.id;
                  }
                } catch (err) {
                  console.log("Could not fetch contacts:", err);
                }
              }
            }

            if (contactId) {
              // Update existing contact
              await window.apiPut(`/api/contacts/${contactId}`, {
                contact: updatedCard.contact,
              });
            } else {
              // Create new contact
              await window.apiPost("/api/contacts", {
                contact: updatedCard.contact,
                source: updatedCard.source || "",
                vcfContent: updatedCard.vcfContent || "",
              });
            }

            setEditingCard(null);

            // Show success message
            alert(
              `Contact "${updatedCard.contact.fullName}" saved successfully!`,
            );
          } catch (error) {
            console.error("Error saving contact:", error);
            alert("Error saving contact. See console for details.");
          }
        };

        const handleCloseEdit = () => {
          setEditingCard(null);
        };

        return (
          <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
            <Sidebar
              activeTab={activeTab}
              onTabChange={setActiveTab}
              tweaks={tweaks}
            />
            <div
              style={{
                flex: 1,
                display: "flex",
                flexDirection: "column",
                overflow: "hidden",
                minWidth: 0,
              }}
            >
              <TopBar activeTab={activeTab} />
              <main
                style={{
                  flex: 1,
                  overflow: "hidden",
                  display: "flex",
                  flexDirection: "column",
                  minHeight: 0,
                }}
              >
                {activeTab === "scanner" && (
                  <ScannerTab
                    tweaks={tweaks}
                    densityPad={densityPad}
                    onEditCard={handleEditCard}
                  />
                )}
                {activeTab === "contacts" && (
                  <ContactsTab tweaks={tweaks} densityPad={densityPad} />
                )}
                {activeTab === "history" && (
                  <HistoryTab tweaks={tweaks} densityPad={densityPad} />
                )}
              </main>
            </div>

            {/* Inline Tweaks panel (not using TweaksPanel component to avoid conflicts) */}
            {panelOpen && (
              <div
                style={{
                  position: "fixed",
                  right: 16,
                  bottom: 16,
                  zIndex: 9999,
                  width: 260,
                  background: "rgba(0, 0, 0, 0.5)",
                  backdropFilter: "blur(20px)",
                  borderRadius: 14,
                  border: "0.5px solid rgba(255,255,255,0.6)",
                  boxShadow: "0 12px 40px rgba(0,0,0,0.18)",
                  fontFamily: "Inter, sans-serif",
                  overflow: "hidden",
                }}
              >
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    padding: "10px 8px 10px 14px",
                    borderBottom: "1px solid rgba(0,0,0,0.06)",
                  }}
                >
                  <b style={{ fontSize: 12 }}>Tweaks</b>
                  <button
                    onClick={() => setPanelOpen(false)}
                    style={{
                      background: "none",
                      border: "none",
                      cursor: "pointer",
                      fontSize: 13,
                      color: "rgba(0,0,0,0.4)",
                      width: 22,
                      height: 22,
                      borderRadius: 6,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                    }}
                  >
                    ✕
                  </button>
                </div>
                <div
                  style={{
                    padding: "12px 14px",
                    display: "flex",
                    flexDirection: "column",
                    gap: 14,
                  }}
                >
                  {/* Accent */}
                  <div>
                    <div
                      style={{
                        fontSize: 10,
                        fontWeight: 600,
                        letterSpacing: "0.06em",
                        textTransform: "uppercase",
                        color: "rgba(0,0,0,0.4)",
                        marginBottom: 7,
                      }}
                    >
                      Accent Color
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {[
                        ["indigo", "oklch(55% 0.22 264)"],
                        ["teal", "oklch(53% 0.18 185)"],
                        ["violet", "oklch(54% 0.22 290)"],
                        ["rose", "oklch(53% 0.2 25)"],
                      ].map(([name, color]) => (
                        <button
                          key={name}
                          onClick={() => setTweak("accentColor", name)}
                          style={{
                            width: 26,
                            height: 26,
                            borderRadius: "50%",
                            background: color,
                            border: `2.5px solid ${tweaks.accentColor === name ? "white" : "transparent"}`,
                            outline:
                              tweaks.accentColor === name
                                ? `2px solid ${color}`
                                : "none",
                            cursor: "pointer",
                            transition: "all 0.15s",
                          }}
                        />
                      ))}
                    </div>
                  </div>
                  {/* Sidebar */}
                  <div>
                    <div
                      style={{
                        fontSize: 10,
                        fontWeight: 600,
                        letterSpacing: "0.06em",
                        textTransform: "uppercase",
                        color: "rgba(0,0,0,0.4)",
                        marginBottom: 7,
                      }}
                    >
                      Sidebar
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {["dark", "light"].map((opt) => (
                        <button
                          key={opt}
                          onClick={() => setTweak("sidebarStyle", opt)}
                          style={{
                            flex: 1,
                            padding: "5px 0",
                            borderRadius: 7,
                            border: "1px solid",
                            borderColor:
                              tweaks.sidebarStyle === opt
                                ? "var(--accent)"
                                : "rgba(0,0,0,0.1)",
                            background:
                              tweaks.sidebarStyle === opt
                                ? "var(--accent-soft)"
                                : "transparent",
                            color:
                              tweaks.sidebarStyle === opt
                                ? "var(--accent)"
                                : "rgba(0,0,0,0.5)",
                            fontSize: 12,
                            fontWeight: 500,
                            fontFamily: "inherit",
                            cursor: "pointer",
                            transition: "all 0.15s",
                            textTransform: "capitalize",
                          }}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                  {/* Density */}
                  <div>
                    <div
                      style={{
                        fontSize: 10,
                        fontWeight: 600,
                        letterSpacing: "0.06em",
                        textTransform: "uppercase",
                        color: "rgba(0,0,0,0.4)",
                        marginBottom: 7,
                      }}
                    >
                      Density
                    </div>
                    <div style={{ display: "flex", gap: 5 }}>
                      {["compact", "comfortable", "spacious"].map((opt) => (
                        <button
                          key={opt}
                          onClick={() => setTweak("density", opt)}
                          style={{
                            flex: 1,
                            padding: "5px 0",
                            borderRadius: 7,
                            border: "1px solid",
                            borderColor:
                              tweaks.density === opt
                                ? "var(--accent)"
                                : "rgba(0,0,0,0.1)",
                            background:
                              tweaks.density === opt
                                ? "var(--accent-soft)"
                                : "transparent",
                            color:
                              tweaks.density === opt
                                ? "var(--accent)"
                                : "rgba(0,0,0,0.5)",
                            fontSize: 11,
                            fontWeight: 500,
                            fontFamily: "inherit",
                            cursor: "pointer",
                            transition: "all 0.15s",
                            textTransform: "capitalize",
                          }}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Edit Modal */}
            {editingCard && (
              <EditModal
                card={editingCard}
                onSave={handleSaveEdit}
                onClose={handleCloseEdit}
              />
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
