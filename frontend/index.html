    <!-- API helpers (same-origin) -->
    <script>
      window.API = "";
      window.apiGet = (path) => fetch(window.API + path).then((r) => r.json());
      window.apiPost = (path, data) =>
        fetch(window.API + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        }).then((r) => r.json());
      window.apiDel = (path) =>
        fetch(window.API + path, { method: "DELETE" }).then((r) => r.json());
      window.apiPut = (path, data) =>
        fetch(window.API + path, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        }).then((r) => r.json());
      window.apiDown = (path) => {
        window.location.href = window.API + path;
      };
    </script>

      body {
        font-family:

          -apple-system,
          BlinkMacSystemFont,

        background: var(--bg);
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #root {
        height: 100vh;
        display: flex;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-tertiary);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 3px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .fade-in {
        animation: fadeIn 0.22s ease both;
      }
      .pop-in {
        animation: popIn 0.18s ease both;
      }
      .slide-in {
        animation: slideIn 0.2s ease both;
      }
    </style>

      // Usage (in an HTML file that loads React + Babel):
      //
      //   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      //     "primaryColor": "#D97757",
      //     "fontSize": 16,
      //     "density": "regular",
      //     "dark": false
      //   }/*EDITMODE-END*/;

      //     return (
      //       <div style={{ fontSize: t.fontSize, color: t.primaryColor }}>

      //         <TweaksPanel>

      // ── useTweaks ───────────────────────────────────────────────────────────────
      // Single source of truth for tweak values. setTweak persists via the host
      // (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
      function useTweaks(defaults) {
        const [values, setValues] = React.useState(defaults);
        // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
        // useState-style call doesn't write a "[object Object]" key into the persisted
        // JSON block.
        const setTweak = React.useCallback((keyOrEdits, val) => {
          const edits =
            typeof keyOrEdits === "object" && keyOrEdits !== null
              ? keyOrEdits
              : { [keyOrEdits]: val };
          setValues((prev) => ({ ...prev, ...edits }));
        }, []);
        return [values, setTweak];
      }

      // ── TweaksPanel ─────────────────────────────────────────────────────────────
      // Floating shell. Registers the protocol listener BEFORE announcing
      // availability — if the announce ran first, the host's activate could land
      // before our handler exists and the toolbar toggle would silently no-op.
      // The close button posts __edit_mode_dismissed so the host's toolbar toggle
      // flips off in lockstep; the host echoes __deactivate_edit_mode back which
      // is what actually hides the panel.
      function TweaksPanel({ title = "Tweaks", children }) {
        const [open, setOpen] = React.useState(false);
        const dragRef = React.useRef(null);
        const offsetRef = React.useRef({ x: 16, y: 16 });
        const PAD = 16;

        const clampToViewport = React.useCallback(() => {
          const panel = dragRef.current;
          if (!panel) return;
          const w = panel.offsetWidth,
            h = panel.offsetHeight;
          const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
          const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
          offsetRef.current = {
            x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
            y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
          };
          panel.style.right = offsetRef.current.x + "px";
          panel.style.bottom = offsetRef.current.y + "px";
        }, []);

        React.useEffect(() => {
          if (!open) return;
          clampToViewport();
          if (typeof ResizeObserver === "undefined") {
            window.addEventListener("resize", clampToViewport);
            return () => window.removeEventListener("resize", clampToViewport);
          }
          const ro = new ResizeObserver(clampToViewport);
          ro.observe(document.documentElement);
          return () => ro.disconnect();
        }, [open, clampToViewport]);

        React.useEffect(() => {
          const onMsg = (e) => {
            const t = e?.data?.type;
            if (t === "__activate_edit_mode") setOpen(true);
            else if (t === "__deactivate_edit_mode") setOpen(false);
          };
          window.addEventListener("message", onMsg);
          return () => window.removeEventListener("message", onMsg);
        }, []);

        const dismiss = () => setOpen(false);

        const onDragStart = (e) => {
          const panel = dragRef.current;
          if (!panel) return;
          const r = panel.getBoundingClientRect();
          const sx = e.clientX,
            sy = e.clientY;
          const startRight = window.innerWidth - r.right;
          const startBottom = window.innerHeight - r.bottom;
          const move = (ev) => {
            offsetRef.current = {
              x: startRight - (ev.clientX - sx),
              y: startBottom - (ev.clientY - sy),
            };
            clampToViewport();
          };
          const up = () => {
            window.removeEventListener("mousemove", move);
            window.removeEventListener("mouseup", up);
          };
          window.addEventListener("mousemove", move);
          window.addEventListener("mouseup", up);
        };

        if (!open) return null;
        return (
          <>
            <style>{__TWEAKS_STYLE}</style>
            <div
              ref={dragRef}
              className="twk-panel"
              data-noncommentable=""
              style={{
                right: offsetRef.current.x,
                bottom: offsetRef.current.y,
              }}
            >
              <div className="twk-hd" onMouseDown={onDragStart}>
                <b>{title}</b>
                <button
                  className="twk-x"
                  aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}
                >
                  ✕
                </button>
              </div>
              <div className="twk-body">{children}</div>
            </div>
          </>
        );
      }

      // ── Layout helpers ──────────────────────────────────────────────────────────

      function TweakSection({ label, children }) {
        return (
          <>
            <div className="twk-sect">{label}</div>
            {children}

      function TweakRow({ label, value, children, inline = false }) {
        return (
          <div className={inline ? "twk-row twk-row-h" : "twk-row"}>
            <div className="twk-lbl">
              <span>{label}</span>

      // ── Controls ────────────────────────────────────────────────────────────────

      function TweakSlider({
        label,
        value,
        min = 0,
        max = 100,
        step = 1,
        unit = "",
        onChange,
      }) {
        return (
          <TweakRow label={label} value={`${value}${unit}`}>
            <input
              type="range"
              className="twk-slider"
              min={min}
              max={max}
              step={step}
              value={value}
              onChange={(e) => onChange(Number(e.target.value))}

        );
      }

      function TweakToggle({ label, value, onChange }) {
        return (
          <div className="twk-row twk-row-h">
            <div className="twk-lbl">
              <span>{label}</span>
            </div>
            <button
              type="button"
              className="twk-toggle"
              data-on={value ? "1" : "0"}
              role="switch"
              aria-checked={!!value}
              onClick={() => onChange(!value)}
            >
              <i />
            </button>
          </div>
        );
      }

      function TweakRadio({ label, value, options, onChange }) {
        const trackRef = React.useRef(null);
        const [dragging, setDragging] = React.useState(false);
        const opts = options.map((o) =>
          typeof o === "object" ? o : { value: o, label: o },
        );
        const idx = Math.max(
          0,
          opts.findIndex((o) => o.value === value),
        );
        const n = opts.length;

        // The active value is read by pointer-move handlers attached for the lifetime
        // of a drag — ref it so a stale closure doesn't fire onChange for every move.
        const valueRef = React.useRef(value);
        valueRef.current = value;

        const segAt = (clientX) => {
          const r = trackRef.current.getBoundingClientRect();
          const inner = r.width - 4;
          const i = Math.floor(((clientX - r.left - 2) / inner) * n);
          return opts[Math.max(0, Math.min(n - 1, i))].value;
        };

        const onPointerDown = (e) => {
          setDragging(true);
          const v0 = segAt(e.clientX);
          if (v0 !== valueRef.current) onChange(v0);
          const move = (ev) => {
            if (!trackRef.current) return;
            const v = segAt(ev.clientX);
            if (v !== valueRef.current) onChange(v);
          };
          const up = () => {
            setDragging(false);
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        };

        return (
          <TweakRow label={label}>
            <div
              ref={trackRef}
              role="radiogroup"
              onPointerDown={onPointerDown}
              className={dragging ? "twk-seg dragging" : "twk-seg"}
            >
              <div
                className="twk-seg-thumb"
                style={{
                  left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                  width: `calc((100% - 4px) / ${n})`,
                }}
              />
              {opts.map((o) => (
                <button
                  key={o.value}
                  type="button"
                  role="radio"
                  aria-checked={o.value === value}
                >
                  {o.label}
                </button>
              ))}
            </div>
          </TweakRow>
        );
      }

      function TweakSelect({ label, value, options, onChange }) {
        return (
          <TweakRow label={label}>
            <select
              className="twk-field"
              value={value}
              onChange={(e) => onChange(e.target.value)}
            >
              {options.map((o) => {
                const v = typeof o === "object" ? o.value : o;
                const l = typeof o === "object" ? o.label : o;
                return (

      function TweakText({ label, value, placeholder, onChange }) {
        return (
          <TweakRow label={label}>

              type="text"
              value={value}
              placeholder={placeholder}

      function TweakNumber({
        label,
        value,
        min,
        max,
        step = 1,
        unit = "",
        onChange,
      }) {
        const clamp = (n) => {
          if (min != null && n < min) return min;
          if (max != null && n > max) return max;
          return n;
        };
        const startRef = React.useRef({ x: 0, val: 0 });
        const onScrubStart = (e) => {
          e.preventDefault();
          startRef.current = { x: e.clientX, val: value };
          const decimals = (String(step).split(".")[1] || "").length;
          const move = (ev) => {
            const dx = ev.clientX - startRef.current.x;
            const raw = startRef.current.val + dx * step;
            const snapped = Math.round(raw / step) * step;
            onChange(clamp(Number(snapped.toFixed(decimals))));
          };
          const up = () => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        };
        return (
          <div className="twk-num">
            <span className="twk-num-lbl" onPointerDown={onScrubStart}>
              {label}
            </span>
            <input
              type="number"
              value={value}
              min={min}
              max={max}
              step={step}
              onChange={(e) => onChange(clamp(Number(e.target.value)))}
            />
            {unit && <span className="twk-num-unit">{unit}</span>}
          </div>
        );
      }

      function TweakColor({ label, value, onChange }) {
        return (
          <div className="twk-row twk-row-h">
            <div className="twk-lbl">
              <span>{label}</span>
            </div>

              className="twk-swatch"
              value={value}
              onChange={(e) => onChange(e.target.value)}

            type="button"
            className={secondary ? "twk-btn secondary" : "twk-btn"}
            onClick={onClick}
          >
            {label}
          </button>
        );

      // ─── Grid Overlay (draggable lines) ──────────────────────────────────────────
      function GridOverlay({ lines, onChange }) {
        const wrapRef = useRef(null);
        const MIN_GAP = 0.02; // 2% of the dimension between adjacent lines

        // Pull margins with defaults
        const top = lines.top ?? 0;
        const bottom = lines.bottom ?? 1;
        const left = lines.left ?? 0;
        const right = lines.right ?? 1;

        // Drag handlers for internal dividers (h, v)
        const startDragInternal = (kind, idx) => (e) => {
          e.preventDefault();
          e.stopPropagation();
          const wrap = wrapRef.current;
          if (!wrap) return;
          const move = (ev) => {
            const r = wrap.getBoundingClientRect();
            if (r.width === 0 || r.height === 0) return;
            let frac =
              kind === "h"
                ? (ev.clientY - r.top) / r.height
                : (ev.clientX - r.left) / r.width;
            const arr = lines[kind] || [];
            const lo = kind === "h" ? top : left;
            const hi = kind === "h" ? bottom : right;
            const prev = idx > 0 ? arr[idx - 1] : lo;
            const next = idx < arr.length - 1 ? arr[idx + 1] : hi;
            frac = Math.max(prev + MIN_GAP, Math.min(next - MIN_GAP, frac));
            const newArr = arr.slice();
            newArr[idx] = frac;
            onChange({ ...lines, [kind]: newArr });
          };
          const up = () => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        };

        // Drag handlers for the 4 outer edges
        const startDragEdge = (edge) => (e) => {
          e.preventDefault();
          e.stopPropagation();
          const wrap = wrapRef.current;
          if (!wrap) return;
          const move = (ev) => {
            const r = wrap.getBoundingClientRect();
            if (r.width === 0 || r.height === 0) return;
            let frac =
              edge === "top" || edge === "bottom"
                ? (ev.clientY - r.top) / r.height
                : (ev.clientX - r.left) / r.width;
            frac = Math.max(0, Math.min(1, frac));
            const internalH = lines.h || [];
            const internalV = lines.v || [];
            if (edge === "top") {
              const limit = internalH.length
                ? internalH[0] - MIN_GAP
                : bottom - MIN_GAP;
              frac = Math.min(frac, limit);
              onChange({ ...lines, top: Math.max(0, frac) });
            } else if (edge === "bottom") {
              const limit = internalH.length
                ? internalH[internalH.length - 1] + MIN_GAP
                : top + MIN_GAP;
              frac = Math.max(frac, limit);
              onChange({ ...lines, bottom: Math.min(1, frac) });
            } else if (edge === "left") {
              const limit = internalV.length
                ? internalV[0] - MIN_GAP
                : right - MIN_GAP;
              frac = Math.min(frac, limit);
              onChange({ ...lines, left: Math.max(0, frac) });
            } else {
              const limit = internalV.length
                ? internalV[internalV.length - 1] + MIN_GAP
                : left + MIN_GAP;
              frac = Math.max(frac, limit);
              onChange({ ...lines, right: Math.min(1, frac) });
            }
          };
          const up = () => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        };

        const ACCENT = "oklch(55% 0.18 145)";
        const HANDLE = {
          position: "absolute",
          width: 22,
          height: 22,
          borderRadius: 11,
          background: "white",
          border: `2px solid ${ACCENT}`,
          boxShadow: "0 2px 6px rgba(0,0,0,0.25)",
          pointerEvents: "all",
          transform: "translate(-50%, -50%)",
          zIndex: 3,
        };
        // Outer-edge handles are square-ish to differentiate visually
        const EDGE_HANDLE = {
          ...HANDLE,
          width: 16,
          height: 16,
          borderRadius: 4,
          background: ACCENT,
          border: "2px solid white",
          zIndex: 4,
        };
        const lineCommon = {
          position: "absolute",
          pointerEvents: "none",
          zIndex: 1,
        };
        // Outer edges are SOLID, internal dividers are DASHED
        const SOLID = `2px solid ${ACCENT}`;
        const DASHED = `2px dashed ${ACCENT}`;

        // Mid-points for placing handles
        const midX = (left + right) / 2;
        const midY = (top + bottom) / 2;

        return (
          <div
            ref={wrapRef}
            style={{ position: "absolute", inset: 0, pointerEvents: "none" }}
          >
            {/* Dim area outside the crop box for visual feedback */}
            <div
              style={{
                position: "absolute",
                left: 0,
                right: 0,
                top: 0,
                height: `${top * 100}%`,
                background: "rgba(0,0,0,0.32)",
                pointerEvents: "none",
                zIndex: 0,
              }}
            />
            <div
              style={{
                position: "absolute",
                left: 0,
                right: 0,
                bottom: 0,
                height: `${(1 - bottom) * 100}%`,
                background: "rgba(0,0,0,0.32)",
                pointerEvents: "none",
                zIndex: 0,
              }}
            />
            <div
              style={{
                position: "absolute",
                top: `${top * 100}%`,
                height: `${(bottom - top) * 100}%`,
                left: 0,
                width: `${left * 100}%`,
                background: "rgba(0,0,0,0.32)",
                pointerEvents: "none",
                zIndex: 0,
              }}
            />
            <div
              style={{
                position: "absolute",
                top: `${top * 100}%`,
                height: `${(bottom - top) * 100}%`,
                right: 0,
                width: `${(1 - right) * 100}%`,
                background: "rgba(0,0,0,0.32)",
                pointerEvents: "none",
                zIndex: 0,
              }}
            />

            {/* Outer edges (solid) */}
            <div
              style={{
                ...lineCommon,
                left: `${left * 100}%`,
                right: `${(1 - right) * 100}%`,
                top: `${top * 100}%`,
                borderTop: SOLID,
              }}
            />
            <div
              style={{
                ...lineCommon,
                left: `${left * 100}%`,
                right: `${(1 - right) * 100}%`,
                top: `${bottom * 100}%`,
                borderTop: SOLID,
              }}
            />
            <div
              style={{
                ...lineCommon,
                top: `${top * 100}%`,
                bottom: `${(1 - bottom) * 100}%`,
                left: `${left * 100}%`,
                borderLeft: SOLID,
              }}
            />
            <div
              style={{
                ...lineCommon,
                top: `${top * 100}%`,
                bottom: `${(1 - bottom) * 100}%`,
                left: `${right * 100}%`,
                borderLeft: SOLID,
              }}
            />

            {/* Internal dividers (dashed) */}
            {(lines.h || []).map((y, i) => (
              <div
                key={`hl-${i}`}
                style={{
                  ...lineCommon,
                  left: `${left * 100}%`,
                  right: `${(1 - right) * 100}%`,
                  top: `${y * 100}%`,
                  borderTop: DASHED,
                }}
              />
            ))}
            {(lines.v || []).map((x, i) => (
              <div
                key={`vl-${i}`}
                style={{
                  ...lineCommon,
                  top: `${top * 100}%`,
                  bottom: `${(1 - bottom) * 100}%`,
                  left: `${x * 100}%`,
                  borderLeft: DASHED,
                }}
              />
            ))}

            {/* Internal-divider handles */}
            {(lines.h || []).map((y, i) => (
              <div
                key={`hh-${i}`}
                onPointerDown={startDragInternal("h", i)}
                title={`Row line ${i + 1}`}
                style={{
                  ...HANDLE,
                  left: `${midX * 100}%`,
                  top: `${y * 100}%`,
                  cursor: "ns-resize",
                }}
              />
            ))}
            {(lines.v || []).map((x, i) => (
              <div
                key={`vh-${i}`}
                onPointerDown={startDragInternal("v", i)}
                title={`Column line ${i + 1}`}
                style={{
                  ...HANDLE,
                  top: `${midY * 100}%`,
                  left: `${x * 100}%`,
                  cursor: "ew-resize",
                }}
              />
            ))}

            {/* Outer-edge handles */}
            <div
              onPointerDown={startDragEdge("top")}
              title="Top edge"
              style={{
                ...EDGE_HANDLE,
                left: `${midX * 100}%`,
                top: `${top * 100}%`,
                cursor: "ns-resize",
              }}
            />
            <div
              onPointerDown={startDragEdge("bottom")}
              title="Bottom edge"
              style={{
                ...EDGE_HANDLE,
                left: `${midX * 100}%`,
                top: `${bottom * 100}%`,
                cursor: "ns-resize",
              }}
            />
            <div
              onPointerDown={startDragEdge("left")}
              title="Left edge"
              style={{
                ...EDGE_HANDLE,
                top: `${midY * 100}%`,
                left: `${left * 100}%`,
                cursor: "ew-resize",
              }}
            />
            <div
              onPointerDown={startDragEdge("right")}
              title="Right edge"
              style={{
                ...EDGE_HANDLE,
                top: `${midY * 100}%`,
                left: `${right * 100}%`,
                cursor: "ew-resize",
              }}
            />

            {/* Tile numbers — small badge in top-left of each cell */}
            {(() => {
              const ys = [top, ...(lines.h || []), bottom];
              const xs = [left, ...(lines.v || []), right];
              const labels = [];
              let n = 1;
              for (let ri = 0; ri < ys.length - 1; ri++) {
                for (let ci = 0; ci < xs.length - 1; ci++) {
                  const cellLeft = xs[ci];
                  const cellTop = ys[ri];
                  const cellW = xs[ci + 1] - cellLeft;
                  const cellH = ys[ri + 1] - cellTop;
                  if (cellW <= 0 || cellH <= 0) continue;
                  labels.push(
                    <div
                      key={`lbl-${n}`}
                      style={{
                        position: "absolute",
                        top: `calc(${cellTop * 100}% + 6px)`,
                        left: `calc(${cellLeft * 100}% + 6px)`,
                        minWidth: 18,
                        height: 18,
                        padding: "0 5px",
                        borderRadius: 4,
                        background: ACCENT,
                        color: "white",
                        fontSize: 11,
                        fontWeight: 700,
                        lineHeight: "18px",
                        textAlign: "center",
                        pointerEvents: "none",
                        zIndex: 2,
                        boxShadow: "0 1px 2px rgba(0,0,0,0.25)",
                      }}
                    >
                      {n}
                    </div>,
                  );
                  n++;
                }
              }
              return labels;
            })()}
          </div>
        );
      }

      // ─── Processing State ─────────────────────────────────────────────────────────

            {/* Header row */}
            <div

                display: "flex",
                alignItems: "center",

              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div
                  style={{
                    width: 8,
                    height: 8,
                    borderRadius: "50%",
                    background: "var(--accent)",
                    animation: "pulse 1.5s ease-in-out infinite",
                  }}

                <span
                  style={{
                    fontSize: 15,

      // ─── Conflict Resolver ────────────────────────────────────────────────────────
      // Interactive per-field picker for locked-contact conflicts. Lets the
      // user choose existing vs incoming for each field and POSTs the merged
      // updates to /api/contacts/{repoId}/resolve. `nameHint` shows above the
      // list when used in a multi-contact context (History run card).
      function ConflictResolver({ repoId, conflicts, nameHint, onResolved }) {
        const initial = React.useMemo(() => {
          const m = {};
          (conflicts || []).forEach((cf) => {
            m[cf.field] = "existing";
          });
          return m;
        }, [conflicts]);
        const [choices, setChoices] = useState(initial);
        const [busy, setBusy] = useState(false);
        const [done, setDone] = useState(false);

        if (!conflicts || conflicts.length === 0) return null;

        const changedCount = Object.keys(choices).filter(
          (k) => choices[k] === "incoming",
        ).length;

        const handleApply = async () => {
          if (!repoId) {
            alert(
              "Can't apply — this card hasn't been saved to the contacts repository yet.",
            );
            return;
          }
          const updates = {};
          conflicts.forEach((cf) => {
            if (choices[cf.field] === "incoming") {
              updates[cf.field] = cf.incoming;
            }
          });
          if (Object.keys(updates).length === 0) {
            setDone(true);
            return;
          }
          setBusy(true);
          try {
            const r = await fetch("/api/contacts/" + repoId + "/resolve", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ updates }),
            });
            if (!r.ok) throw new Error("HTTP " + r.status);
            const data = await r.json();
            setDone(true);
            onResolved && onResolved(data.contact);
          } catch (err) {
            console.error("[resolve] failed:", err);
            alert("Failed to apply changes: " + err.message);
          } finally {
            setBusy(false);
          }
        };

        if (done) {
          return (
            <div
              style={{
                fontSize: 11,
                color: "var(--success)",
                fontStyle: "italic",
                padding: "4px 0",
              }}
            >
              ✓ Conflicts resolved
              {nameHint ? ` for ${nameHint}` : ""}.
            </div>
          );
        }

        const radioOpt = (field, side, value) => (
          <label
            style={{
              display: "flex",
              alignItems: "center",
              gap: 6,
              cursor: "pointer",
              padding: "2px 6px",
              borderRadius: 4,
              background:
                choices[field] === side ? "var(--accent-soft)" : "transparent",
              border:
                choices[field] === side
                  ? "1px solid var(--accent)"
                  : "1px solid transparent",
              flex: 1,
              minWidth: 0,
            }}
          >
            <input
              type="radio"
              name={`${repoId || "unsaved"}::${field}`}
              checked={choices[field] === side}
              onChange={() =>
                setChoices((prev) => ({ ...prev, [field]: side }))
              }
              style={{ margin: 0, flexShrink: 0 }}
            />
            <code
              style={{
                background: "var(--bg)",
                padding: "1px 5px",
                borderRadius: 3,
                fontSize: 10,
                overflow: "hidden",
                textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}
              title={String(value)}
            >
              {String(value) || "(empty)"}
            </code>
          </label>
        );

        return (
          <div>
            {nameHint && (
              <div style={{ fontWeight: 600, marginBottom: 4, fontSize: 11 }}>
                {nameHint}
              </div>
            )}
            {conflicts.map((cf, k) => (
              <div
                key={k}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  marginBottom: 5,
                  fontSize: 11,
                  lineHeight: 1.4,
                }}
              >
                <strong
                  style={{
                    minWidth: 70,
                    color: "var(--text-primary)",
                    flexShrink: 0,
                  }}
                >
                  {cf.field}:
                </strong>
                {radioOpt(cf.field, "existing", cf.existing)}
                {radioOpt(cf.field, "incoming", cf.incoming)}
              </div>
            ))}
            <div
              style={{
                display: "flex",
                gap: 8,
                alignItems: "center",
                marginTop: 8,
              }}
            >
              <button
                onClick={handleApply}
                disabled={busy || !repoId}
                style={{
                  padding: "5px 12px",
                  fontSize: 11,
                  fontWeight: 600,
                  background: busy || !repoId ? "var(--bg)" : "var(--accent)",
                  color: busy || !repoId ? "var(--text-tertiary)" : "white",
                  border: "1px solid var(--accent)",
                  borderRadius: 4,
                  cursor: busy || !repoId ? "not-allowed" : "pointer",
                }}
                title={
                  !repoId
                    ? "Save the contact first to enable conflict resolution"
                    : ""
                }
              >
                {busy
                  ? "Applying…"
                  : changedCount === 0
                    ? "Keep all existing"
                    : `Apply ${changedCount} change${changedCount !== 1 ? "s" : ""}`}
              </button>
              <span style={{ fontSize: 10, color: "var(--text-tertiary)" }}>
                left = keep existing · right = use incoming
              </span>
            </div>
          </div>
        );
      }

      // ─── QR Link Fetcher ──────────────────────────────────────────────────────────
      // Shown when a card's QR code encoded a URL (a hosted vCard / digital
      // business card) instead of inline fields. Nothing is fetched until the
      // user clicks — the request goes to POST /api/resolve-qr-url, which runs
      // SSRF + scheme + (optional) Safe-Browsing checks server-side before
      // making any outbound request. On success the pulled fields are merged
      // into the card via onMergeQr.
      function QrLinkFetcher({ cardId, url, onMergeQr }) {
        const [busy, setBusy] = useState(false);
        const [done, setDone] = useState(false);
        const [error, setError] = useState(null);
        const [source, setSource] = useState("");

        if (!url) return null;

        const shortUrl = url.length > 60 ? url.slice(0, 57) + "…" : url;

        const handleFetch = async () => {
          setBusy(true);
          setError(null);
          try {
            const r = await fetch("/api/resolve-qr-url", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ url }),
            });
            const data = await r.json();
            if (!data.ok) {
              setError(data.reason || "Could not fetch contact data");
              return;
            }
            const fields = data.contact || {};
            if (Object.keys(fields).length === 0) {
              setError("No contact data found at that link.");
              return;
            }
            setSource(data.source || "");
            setDone(true);
            onMergeQr && onMergeQr(cardId, fields);
          } catch (err) {
            setError("Request failed: " + err.message);
          } finally {
            setBusy(false);
          }
        };

        return (
          <div
            style={{
              background: "var(--accent-soft)",
              border: "1px solid var(--accent)",
              borderRadius: 6,
              padding: "8px 10px",
              marginBottom: 6,
            }}
          >
            <div
              style={{
                fontSize: 11,
                fontWeight: 700,
                color: "var(--accent)",
                textTransform: "uppercase",
                letterSpacing: "0.06em",
                marginBottom: 4,
                display: "flex",
                alignItems: "center",
                gap: 5,
              }}
            >
              <Icons.globe width={11} height={11} color="currentColor" />
              QR code links to a contact page
            </div>
            <div
              style={{
                fontSize: 11,
                color: "var(--text-secondary)",
                marginBottom: 8,
                wordBreak: "break-all",
                fontFamily: "ui-monospace, monospace",
              }}
              title={url}
            >
              {shortUrl}
            </div>
            {done ? (
              <div
                style={{
                  fontSize: 11,
                  color: "var(--success)",
                  fontWeight: 500,
                }}
              >
                ✓ Pulled contact data{source ? ` (${source})` : ""} and filled
                empty fields. Review above, then Save.
              </div>
            ) : (
              <>
                <button
                  onClick={handleFetch}
                  disabled={busy}
                  style={{
                    padding: "5px 12px",
                    fontSize: 11,
                    fontWeight: 600,
                    background: busy ? "var(--bg)" : "var(--accent)",
                    color: busy ? "var(--text-tertiary)" : "white",
                    border: "1px solid var(--accent)",
                    borderRadius: 4,
                    cursor: busy ? "wait" : "pointer",
                  }}
                >
                  {busy ? "Checking + fetching…" : "Fetch contact data"}
                </button>
                <span
                  style={{
                    fontSize: 10,
                    color: "var(--text-tertiary)",
                    marginLeft: 8,
                  }}
                >
                  Link is safety-checked before opening.
                </span>
                {error && (
                  <div
                    style={{
                      fontSize: 11,
                      color: "var(--danger)",
                      marginTop: 6,
                    }}
                  >
                    ✗ {error}
                  </div>
                )}
              </>
            )}
          </div>
        );
      }

      // ─── Contact Card (Result) ─────────────────────────────────────────────────────
      function ContactCard({ card, onToggleLock, onSave, onEdit, onMergeQr }) {
        const [expanded, setExpanded] = useState(false);
        const [saved, setSaved] = useState(false);
        const [thumbnailUrl, setThumbnailUrl] = useState(null);

        const c = card.contact;
        const initials = (c.fullName || "?")
          .split(" ")
          .slice(0, 2)
          .map((w) => w[0])
          .join("")
          .toUpperCase();
        const hue =
          ((c.fullName || "")
            .split("")
            .reduce((a, ch) => a + ch.charCodeAt(0), 0) *
            37) %
          360;

        // Load thumbnail if available
        useEffect(() => {
          if (card.thumbnail && card.cardId) {
            const url = `/api/thumbnails/${card.cardId}`;
            setThumbnailUrl(url);
          }
        }, [card.thumbnail, card.cardId]);

        const handleSave = () => {
          setSaved(true);
          onSave && onSave(card);
          setTimeout(() => setSaved(false), 2500);
        };

        const handleEdit = () => {
          onEdit && onEdit(card);
        };

        return (
          <div
            className="pop-in"
            style={{
              background: "var(--surface)",
              border: "1px solid var(--border)",
              borderRadius: "var(--radius-lg)",
              overflow: "hidden",
              transition: "box-shadow 0.2s",
              boxShadow: "var(--shadow-sm)",
            }}
            onMouseEnter={(e) =>
              (e.currentTarget.style.boxShadow = "var(--shadow-md)")
            }
            onMouseLeave={(e) =>
              (e.currentTarget.style.boxShadow = "var(--shadow-sm)")
            }
          >
            {/* Card header */}
            <div
              style={{
                padding: "16px 16px 12px",
                display: "flex",
                gap: 12,
                alignItems: "flex-start",
              }}
            >
              {/* Thumbnail or Avatar */}
              {thumbnailUrl ? (
                <div
                  style={{
                    width: 42,
                    height: 42,
                    borderRadius: 10,
                    flexShrink: 0,
                    overflow: "hidden",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    border: "1px solid var(--border)",
                  }}
                >
                  <img
                    src={thumbnailUrl}
                    alt="Card thumbnail"
                    style={{
                      width: "100%",
                      height: "100%",
                      objectFit: "cover",
                    }}
                    onError={() => setThumbnailUrl(null)}
                  />
                </div>
              ) : (
                <div
                  style={{
                    width: 42,
                    height: 42,
                    borderRadius: 10,
                    flexShrink: 0,
                    background: `oklch(65% 0.15 ${hue})`,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    fontSize: 15,
                    fontWeight: 700,
                    color: "white",
                    letterSpacing: "-0.01em",
                  }}
                >
                  {initials}
                </div>
              )}

              <div style={{ flex: 1, minWidth: 0 }}>
                <div
                  style={{
                    display: "flex",
                    alignItems: "flex-start",
                    justifyContent: "space-between",
                    gap: 8,

      function ResultsPanel({
        cards,

      }) {
        const [view, setView] = useState("grid");
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [bulkSaved, setBulkSaved] = useState(false);
        const [busyFmt, setBusyFmt] = useState(null); // which export is in-flight

        const toggleSelect = (id) => {
          setSelectedIds((prev) => {
            const next = new Set(prev);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            return next;
          });
        };

        // Hit POST /api/scan/export/{fmt} with the current cards, then
        // trigger a browser download from the response blob.
        const downloadExport = async (fmt, fallbackFilename) => {
          if (!cards.length || busyFmt) return;
          setBusyFmt(fmt);
          try {
            const r = await fetch(`/api/scan/export/${fmt}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ cards }),
            });
            if (!r.ok) {
              const detail = await r.text();
              throw new Error(detail || `HTTP ${r.status}`);
            }
            const blob = await r.blob();
            // Filename: prefer server's Content-Disposition, else fallback
            const cd = r.headers.get("Content-Disposition") || "";
            const m = cd.match(/filename="([^"]+)"/);
            const filename = m ? m[1] : fallbackFilename;
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          } catch (err) {
            console.error(`[export ${fmt}] failed:`, err);
            alert(`Export failed: ${err.message || err}`);
          } finally {
            setBusyFmt(null);
          }
        };

        const handleBulkDownload = () => {
          downloadExport("zip", "scan_results.zip").then(() => {
            setBulkSaved(true);
            setTimeout(() => setBulkSaved(false), 2500);
          });
        };

        // Tally conflict/merge/update statistics across this run's cards.
        // Each card has repoStatus = added|updated|merged|conflict and

        const conflictCards = cards.filter(
          (c) => c.repoStatus === "conflict" && (c.conflicts || []).length > 0,
