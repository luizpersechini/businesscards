name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main, improvements]

env:
  # Silence the Node 20 deprecation warning until checkout/setup-python ship
  # versions built on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        # libzbar0  → pyzbar (QR decoding)
        # libheif1  → pillow-heif (HEIC/HEIF photos)
        # tesseract → pytesseract (OCR fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libheif1 tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure test runner tools are present even if requirements blip
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/
